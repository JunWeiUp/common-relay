[package]
name = "common-relay"
version = "0.1.7"
edition = "2021"
rust-version = "1.89"
description = "Common Relay v2 SDK: signed device groups, encrypted files, invitation links, the /v2/ws message client and v2 helpers"
license = "MIT"
publish = false

[dependencies]
base64 = "0.22"
chacha20 = "0.9"
crypto_box = { version = "0.9", features = ["seal"] }
crypto_secretbox = "0.1"
ed25519-dalek = "2"
getrandom = "0.2"
hex = "0.4"
poly1305 = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["macros", "net", "rt", "sync", "time"] }
# ring + bundled webpki roots: cross-compiles for Android and iOS (no aws-lc).
tokio-tungstenite = { version = "0.28", default-features = false, features = ["connect", "handshake", "rustls-tls-webpki-roots"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
url = "2"
x25519-dalek = { version = "2", features = ["static_secrets"] }
zeroize = "1"

[dev-dependencies]
tokio = { version = "1", features = ["io-util", "macros", "net", "rt", "rt-multi-thread", "time"] }

[features]
default = ["serde_json/preserve_order"]
