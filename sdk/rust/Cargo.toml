[package]
name = "common-relay"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
description = "Common Relay v1 client: encrypted messages, streams, files and signed device groups"
license = "MIT"
publish = false

[dependencies]
base64 = "0.22"
chacha20 = "0.9"
crypto_box = "0.9"
crypto_secretbox = "0.1"
ed25519-dalek = "2"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
getrandom = "0.2"
hex = "0.4"
poly1305 = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
rustls = { version = "0.23", default-features = false, features = ["logging", "ring", "std", "tls12"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["macros", "net", "rt", "sync", "time"] }
tokio-tungstenite = { version = "0.28", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
url = "2"
x25519-dalek = { version = "2", features = ["static_secrets"] }
zeroize = "1"

[dev-dependencies]
tokio = { version = "1", features = ["io-util", "rt-multi-thread", "signal"] }

[features]
default = ["serde_json/preserve_order"]
