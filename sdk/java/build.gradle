plugins { id 'maven-publish'; id 'com.android.library' }
android {
    namespace 'io.github.junweiup.commonrelay'
    compileSdk 36
    defaultConfig { minSdk 26 }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies {
    api 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'net.java.dev.jna:jna:5.17.0@aar'
    implementation 'com.goterl:lazysodium-android:5.2.0@aar'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
    testImplementation 'net.java.dev.jna:jna:5.17.0'
}
android.testOptions.unitTests.all { systemProperty 'jna.library.path', System.getenv('SODIUM_LIBRARY_PATH') ?: '' }


group = 'com.github.JunWeiUp.common-relay'
version = System.getenv('VERSION') ?: '0.1.0'

android { publishing { singleVariant('release') } }
afterEvaluate {
    publishing {
        publications {
            release(MavenPublication) {
                from components.release
                artifactId = 'java'
            }
        }
    }
}
