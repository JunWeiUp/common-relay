[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "common-relay"
version = "0.1.2"
requires-python = ">=3.11"
dependencies = ["websockets==15.0.1", "PyNaCl==1.6.0", "httpx==0.28.1"]

[tool.setuptools.packages.find]
where = ["."]
include = ["common_relay*"]
