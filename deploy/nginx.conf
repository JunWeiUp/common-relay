# Include only inside the intended existing HTTPS server block.
# Protocol v2 only: /relay/v1/* was removed and the backend answers 404 for it.

# Device pipe. The server pings every 30 s; keep the read timeout well above that.
location = /v2/ws {
    proxy_pass http://127.0.0.1:47805;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
    proxy_buffering off;
    access_log off;
}

# Resumable encrypted files: 1 MiB chunks, Range downloads.
location ~ "^/v2/files(?:/.*)?$" {
    proxy_pass http://127.0.0.1:47805;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Connection "";
    proxy_request_buffering off;
    proxy_buffering off;
    client_max_body_size 2m;
    proxy_read_timeout 600s;
    proxy_send_timeout 60s;
    access_log off;
}

# Signed device groups, opt-in group creation and short-lived enrollment.
location ~ "^/v2/(group(?:/.*)?|enroll/[a-f0-9]{32}(?:/(?:auto|link))?)$" {
    proxy_pass http://127.0.0.1:47805;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Connection "";
    client_max_body_size 64k;
    proxy_read_timeout 20s;
    proxy_send_timeout 20s;
    access_log off;
}

# Root Admin plane (/v2/admin/*): small JSON bodies only.
location ^~ /v2/admin/ {
    proxy_pass http://127.0.0.1:47805;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header Connection "";
    client_max_body_size 1m;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;
    access_log off;
}

# Remaining device plane (/v2/me, spaces, boxes). Box objects may be large.
location ^~ /v2/ {
    proxy_pass http://127.0.0.1:47805;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header Connection "";
    proxy_request_buffering off;
    proxy_buffering off;
    client_max_body_size 513m;
    client_body_timeout 120s;
    proxy_read_timeout 600s;
    proxy_send_timeout 120s;
    access_log off;
}

# Edge plugins (/edge/{plugin}/{mount}/...: webhook, drop, webdav, mcp).
# The backend caps the body at HardBoxMaxBytes + 1 MiB; plugins enforce their own limits.
location ^~ /edge/ {
    proxy_pass http://127.0.0.1:47805;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Connection "";
    proxy_request_buffering off;
    proxy_buffering off;
    client_max_body_size 513m;
    client_body_timeout 120s;
    proxy_read_timeout 600s;
    proxy_send_timeout 120s;
    access_log off;
}
