# Include only inside the intended existing HTTPS server block.
location = /relay/v1/ws {
    proxy_pass http://127.0.0.1:47805;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
    proxy_buffering off;
    access_log off;
}
location = /relay/v1/files {
    proxy_pass http://127.0.0.1:47805;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Connection "";
    proxy_request_buffering off;
    proxy_buffering off;
    client_max_body_size 2m;
    proxy_read_timeout 600s;
    proxy_send_timeout 60s;
    access_log off;
}
location ^~ /relay/v1/files/ {
    proxy_pass http://127.0.0.1:47805;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Connection "";
    proxy_request_buffering off;
    proxy_buffering off;
    client_max_body_size 2m;
    proxy_read_timeout 600s;
    proxy_send_timeout 60s;
    access_log off;
}

# Device management, opt-in group creation and short-lived enrollment.
location ~ "^/relay/v1/(group(?:/.*)?|enroll/[a-f0-9]{32}(?:/(?:auto|link))?)$" {
    proxy_pass http://127.0.0.1:47805;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Connection "";
    client_max_body_size 64k;
    proxy_read_timeout 20s;
    proxy_send_timeout 20s;
    access_log off;
}
